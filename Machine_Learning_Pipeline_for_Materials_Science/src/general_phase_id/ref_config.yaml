feature_ranges_file: /mnt/d/Projects/Amorphous_RDF/GitHub/general_phase_id_output/feature_ranges.pkl
feature_whitelist:
- R1_SG
- voronoi_volume_temporal
- CN_temporal
- q4
- q6
- gaussian_peak2_center
- gaussian_peak3_center
- neighbor_1
- neighbor_2
- excess_energy_temporal
- local_energy_fluctuation_temporal
- hydrostatic_pressure_temporal
- von_mises_stress_temporal
- deviatoric_norm_temporal
- stress_anisotropy_temporal
- local_enthalpy_temporal
- pe_atom_std_temporal
- pe_volume_residual
inference:
  confidence_threshold: 0.5
  multiple_thresholds:
  - 0.5
  - 0.6
  - 0.7
  - 0.8
  - 0.9
model:
  early_stopping: true
  learning_rate: 0.05
  max_iter: 500
  max_leaf_nodes: 31
  min_samples_leaf: 20
  n_iter_no_change: 10
  random_state: 42
  type: HistGradientBoostingClassifier
  validation_fraction: 0.1
norm_params_file: /mnt/d/Projects/Amorphous_RDF/GitHub/general_phase_id_output/norm_params.pkl
output_dir: general_phase_id_output
reference_phases:
- csv_path: Atomic_Simulation_Post-Processing_Pipeline/outputs/features_5050_csro_fixed.csv
  name: Cu50Zr50
- csv_path: Atomic_Simulation_Post-Processing_Pipeline/outputs/features_4654_csro_fixed.csv
  name: Cu46Zr54
- csv_path: Atomic_Simulation_Post-Processing_Pipeline/outputs/features_6436_csro_fixed.csv
  name: Cu64Zr36
target_structure:
  csv_path: Atomic_Simulation_Post-Processing_Pipeline/outputs/features_polyamorphous_csro_fixed.csv
  dump_path: Machine_Learning_Pipeline_for_Materials_Science/data/polyamorphous/anneal_combined_0.lammpstrj
validation:
  boundary_cutoff: 3.5
  split_axis: x
